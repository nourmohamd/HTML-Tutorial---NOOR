  <body>
    <!-- 
    Formatting
    -->
    <!-- 
    b - bold text
    strong - important text
    i - italic text
    em - emphased text
    u - under line
    ins - inserted text
    del - delete text
    mark - marked text
    sup - superscript text
    sub - subscript
    small - small text
    -->
    <p><b>Noor</b></p>
    <p><strong>Noor</strong></p>
    <p><i>Noor</i></p>
    <p><em>Noor</em></p>
    <p><ins>Noor</ins></p>
    <p><u>Noor</u></p>
    <p><small>Noor</small></p>
    <p><mark>Noor</mark></p>
    <p>e<sup>0</sup></p>
    <p>H<sub>2</sub>O</p>
    <p><del>Noor</del></p>
  </body>

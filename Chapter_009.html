<!doctype html>
<html lang="en-us" dir="ltr">
  <head>
    <title>Chapter 9 | القسم التاسع</title>
    <meta charset="UTF-8" />
  </head>
  <body>
    <!-- Lists -->
    <ul type="square">
      <!-- circle disc square -->
      <li><a href="">HTML</a></li>
      <li><a href="">CSS</a></li>
      <li>
        <a href="">JavaScript</a>
        <ul type="disc">
          <li><a href="">ReactJs</a></li>
          <li><a href="">VueJs</a></li>
          <li><a href="">AngularJs</a></li>
        </ul>
      </li>
    </ul>
    <!-- 
      Start(ol) ===> For Point For Number List Item From That Place
      type(ol) ===> For Make Type Of List Item
      value(li) ===> This Attribute We Put It In li For Start Number Of Items From That Value
      reversed(ol) ===> For Reverse List Items
    -->
    <ol type="a" reversed>
      <!-- 1 a A i I -->
      <li><a href="">Computer</a></li>
      <li><a href="">Laptop</a></li>
      <li><a href="">Mouse</a></li>
      <li><a href="">Keyboard</a></li>
    </ol>
    <dl>
      <dt>Syria</dt>
      <dd>Syria is beautifuly</dd>
    </dl>
  </body>
</html>

<!DOCTYPE html>
<html lang="en-us" dir="ltr">
  <head>
    <title>Chapter 27</title>
    <meta charset="UTF-8" />
  </head>
  <body>
    <!-- Marquee Element -->
    <marquee
      bgcolor="#1787e8"
      direction="left"
      behavior="alternate"
      vspace="200"
      loop="1"
      scrollamount="30"
      >Mohamed Nour Abdo</marquee
    >
    <!-- direction: left, right, up, down -->
    <!-- Attributes For Marquee Elemenet
    bgcolor ==> color
    direction ==> direction (left, right, up, down)
    behavior ==> (alternate, scroll, slide)
    vspace ==> number same margin (vertical)
    hspace ==> number same margin (horizontal)
    loop ==> number of continues (loops)
    scrollamount ==> number of Speed (6 default)-->
  </body>
</html>
